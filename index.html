<style id="gate-style">
/* Everything is scoped to .gate / #gate with its own variable names, so nothing here
   can affect the app once it is decrypted into this same document. */
:root{--g-bg:#EDF1F5;--g-surface:#FFFFFF;--g-ink:#16202A;--g-muted:#566576;--g-line:#D3DCE5;--g-accent:#1D4F91;--g-accent-ink:#FFFFFF;--g-sheet:#D7263D;--g-bad:#B4232F}
@media (prefers-color-scheme: dark){:root{--g-bg:#0E141A;--g-surface:#17202A;--g-ink:#E5ECF3;--g-muted:#92A2B3;--g-line:#2B3846;--g-accent:#86B4EE;--g-accent-ink:#0E141A;--g-sheet:#E2475B;--g-bad:#F2727C}}
body.gate{margin:0;min-height:100vh;background:var(--g-bg);color:var(--g-ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
body.gate *{box-sizing:border-box}
#gate[hidden]{display:none}
#gate{width:100%;max-width:380px;background:var(--g-surface);border:1px solid var(--g-line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
#gate .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
#gate .brand i{display:inline-block;width:20px;height:13px;border-radius:2px;background:var(--g-sheet)}
#gate p{margin:0}
#gate .muted{color:var(--g-muted);font-size:13px}
#gate form{display:flex;flex-direction:column;gap:12px}
#gate input[type=password]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--g-line);border-radius:9px;background:var(--g-surface);color:var(--g-ink);font-size:16px}
#gate label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--g-muted)}
#gate button{font:inherit;font-weight:600;padding:11px;border-radius:9px;border:1px solid var(--g-accent);background:var(--g-accent);color:var(--g-accent-ink);cursor:pointer}
#gate button:disabled{opacity:.6}
#gate :focus-visible{outline:2px solid var(--g-accent);outline-offset:2px}
#gate #msg{color:var(--g-bad);font-size:14px;min-height:1.6em}
</style>
</head>

async function deriveKey(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decrypt(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(pt);
}
function show(html) {
  // Some browsers (Android Chrome) keep this page's styles after document.open(), so remove them first.
  document.getElementById("gate-style")?.remove();
  document.body.className = "";
  document.open(); document.write(html); document.close();
}

(async () => {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      show(await decrypt(key));
      return;
    }
  } catch (e) {
    // the page was re-encrypted or storage is blocked: ask again
    try { localStorage.removeItem(KEY); } catch (_) {}
  }
  document.getElementById("gate").hidden = false;
  document.getElementById("pass").focus();
})();

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), msg = document.getElementById("msg");
  go.disabled = true; go.textContent = "確認しています…"; msg.textContent = "";
  try {
    const key = await deriveKey(document.getElementById("pass").value.trim().normalize("NFC"));
    const html = await decrypt(key);
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY, toB64(await crypto.subtle.exportKey("raw", key))); } catch (_) {}
    }
    show(html);
  } catch (err) {
    msg.textContent = "合言葉が違います。もう一度確かめてください。";
    go.disabled = false; go.textContent = "開く";
  }
});
})();
</script>
