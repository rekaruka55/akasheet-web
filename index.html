<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>赤シート暗記帳</title>
<style>
:root{--bg:#EDF1F5;--surface:#FFFFFF;--ink:#16202A;--muted:#566576;--line:#D3DCE5;--accent:#1D4F91;--accent-ink:#FFFFFF;--sheet:#D7263D;--bad:#B4232F;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0E141A;--surface:#17202A;--ink:#E5ECF3;--muted:#92A2B3;--line:#2B3846;--accent:#86B4EE;--accent-ink:#0E141A;--sheet:#E2475B;--bad:#F2727C;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.brand i{display:inline-block;width:20px;height:13px;border-radius:2px;background:var(--sheet)}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
form{display:flex;flex-direction:column;gap:12px}
input[type=password]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:16px}
label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:11px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{color:var(--bad);font-size:14px;min-height:1.6em}
</style>
</head>
<body>
<main id="gate" hidden>
  <div class="brand"><i aria-hidden="true"></i>赤シート暗記帳</div>
  <p>教えてもらった合言葉を入れてください。</p>
  <form id="form">
    <input type="password" id="pass" autocomplete="current-password" aria-label="合言葉" required>
    <label><input type="checkbox" id="remember" checked> この端末で合言葉を覚える</label>
    <button type="submit" id="go">開く</button>
    <p id="msg" role="alert"></p>
  </form>
  <p class="muted">学習の記録は、このブラウザの中だけに保存されます。</p>
</main>

const KEY = "akasheet-share-key";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKey(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decrypt(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }

(async () => {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      show(await decrypt(key));
      return;
    }
  } catch (e) {
    // the page was re-encrypted or storage is blocked: ask again
    try { localStorage.removeItem(KEY); } catch (_) {}
  }
  document.getElementById("gate").hidden = false;
  document.getElementById("pass").focus();
})();

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), msg = document.getElementById("msg");
  go.disabled = true; go.textContent = "確認しています…"; msg.textContent = "";
  try {
    const key = await deriveKey(document.getElementById("pass").value.trim().normalize("NFC"));
    const html = await decrypt(key);
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY, toB64(await crypto.subtle.exportKey("raw", key))); } catch (_) {}
    }
    show(html);
  } catch (err) {
    msg.textContent = "合言葉が違います。もう一度確かめてください。";
    go.disabled = false; go.textContent = "開く";
  }
});
})();
</script>
